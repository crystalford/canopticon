<!doctype html>
<html><head><meta charset="utf-8">
<!-- The short-maker's player (2026-11-28): the v13 look, with figures drawn from a piece's figure plan. -->
<style>
@font-face { font-family: Geist; src: url(../api/src/site/og/fonts/Geist-Regular.ttf); font-weight: 400; }
@font-face { font-family: Geist; src: url(../api/src/site/og/fonts/Geist-Medium.ttf); font-weight: 500; }
@font-face { font-family: Geist; src: url(../api/src/site/og/fonts/Geist-SemiBold.ttf); font-weight: 600; }

.rule { position:absolute; left:84px; right:84px; top:170px; height:2px; background:var(--hair); }
#stage { position:absolute; left:0; right:0; top:200px; height:1250px; }

.prog { position:absolute; left:84px; right:84px; bottom:110px; height:6px; border-radius:3px; background:var(--hair); }
.prog i { position:absolute; left:0; top:0; bottom:0; border-radius:3px; background:linear-gradient(90deg,#4cc9ff,#b78cff 50%,#3fe6a3); box-shadow:0 0 16px rgba(183,140,255,.5); }
.layer { position:absolute; inset:0; }

.words { position:absolute; left:84px; right:84px; top:660px; font-size:66px; font-weight:500; color:var(--acc); letter-spacing:-.02em; text-shadow:0 0 30px rgba(var(--accrgb),.5); }

</style></head>
<body><div id="v"><div id="bg"></div><div id="cam">
  <div id="stage"></div></div><div id="fx"></div><div id="grade"></div>
  <div class="brand">canopticon</div><div class="kind" id="kind"></div><div class="rule"></div>
  <div id="cap"></div><div id="ring" style="position:absolute;left:84px;bottom:70px;width:912px;height:90px"></div>
</div>
<script>
let SPEC = null;
const clamp = (x) => Math.min(1, Math.max(0, x));

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

let A = null;

// Light and depth: a pool of the shot's colour behind what is being said, soft shapes far behind, the word huge and out of focus.

    const y = ((oy - t * (10 + rnd(j) * 22)) % 1900 + 1900) % 1900, x = ox + Math.sin(t * 0.4 + j) * 14;

    if (lit > 0.02) h += `<div style="position:absolute;left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;border-radius:50%;background:rgba(255,255,255,${0.75 * lit * tw});box-shadow:0 0 ${sz * 3}px rgba(${A.rgb},${0.8 * lit})"></div>`;
  }
  if (b.word) h += `<div style="position:absolute;left:${-40 - k * 60}px;top:1080px;font-family:Geist;font-weight:600;font-size:400px;letter-spacing:-.05em;line-height:1;color:rgba(${A.rgb},${lerp(0.2, 0.055, rack)});filter:blur(${lerp(1.5, 16, rack)}px);white-space:nowrap">${esc(b.word)}</div>`;
  return h;
}
function lens(i, t, light, pulse) {
  const [lx, ly] = light, X = lx, Y = ly + 200, a = 0.22 + 0.6 * pulse;
  let h = `<div style="position:absolute;left:${X - 760}px;top:${Y - 2}px;width:1520px;height:4px;background:linear-gradient(90deg, rgba(${A.rgb},0), rgba(${A.rgb},.7) 35%, rgba(255,255,255,.85) 50%, rgba(${A.rgb},.7) 65%, rgba(${A.rgb},0));filter:blur(1.5px);opacity:${a}"></div>`;
  h += `<div style="position:absolute;left:${X - 640}px;top:${Y - 22}px;width:1280px;height:44px;background:radial-gradient(ellipse, rgba(${A.rgb},.45), rgba(${A.rgb},0) 70%);filter:blur(10px);opacity:${a * 0.7}"></div>`;
  for (let j = 0; j < 4; j++) {
    const r = 18 + rnd(j * 4.4 + i) * 26, x = rnd(j * 2.9 + i) * 1000 + Math.sin(t * 0.25 + j) * 30, y = rnd(j * 6.1 + i) * 1700 + Math.cos(t * 0.2 + j) * 24;
    h += `<div style="position:absolute;left:${x}px;top:${y}px;width:${r * 2}px;height:${r * 2}px;border-radius:50%;background:rgba(${A.rgb},.16);filter:blur(${6 + r / 4}px)"></div>`;
  }

}
const pulseOf = (t, hits) => (hits || []).reduce((m, h) => (t >= h ? Math.max(m, Math.exp(-(t - h) * 2.2)) : m), 0);
// progress: one dot per move of the skeleton, filled as the moves pass; the
// current move glows in its colour and its role is named beside the dots.

  const n = moves.length, gap = 64, x0 = 22;
  const close = B[i].type === "close" ? ease((t - 0.4) / 1.2) : 0;
  let s = `<svg width="912" height="90" style="overflow:visible">`;
  s += `<line x1="${x0}" y1="45" x2="${x0 + gap * (n - 1)}" y2="45" stroke="rgba(255,255,255,.10)" stroke-width="4" stroke-linecap="round"/>`;
  moves.forEach(([b, j], k) => {
    const c = pal(b.color), done = j < i || close > 0, on = j === i, x = x0 + gap * k;
    const r = on ? 13 : 9;
    s += `<circle cx="${x}" cy="45" r="${r}" fill="${done || on ? c.c : "#2a2d33"}" style="${on || close ? `filter:drop-shadow(0 0 ${on ? 14 : 8 * close}px ${c.c})` : ""}"/>`;
  });
  const cur = B[i].move ? B[i] : null;
  const label = cur ? cur.role : close ? "the whole chain" : "";
  if (label) s += `<text x="${x0 + gap * (n - 1) + 44}" y="56" font-size="30" font-weight="600" letter-spacing="1" fill="${cur ? pal(cur.color).c : "#f3f2ee"}">${esc(label.toLowerCase())}</text>`;
  return s + `</svg>`;
}
const RATE = 2.6, PAUSE_END = 1.25, PAUSE_COMMA = 0.55, OVERLAP = 1.4;
function units(b) {
  const ws = (b.say || "").split(/\s+/).filter(Boolean), u = [0];
  ws.forEach((w) => u.push(u[u.length - 1] + 1 + (/[.?!:]$/.test(w) ? PAUSE_END : /[,;—]$/.test(w) ? PAUSE_COMMA : 0)));
  return u;
}
function setSpec(s) {
  SPEC = s; document.getElementById("kind").textContent = s.kind;
  let at = 0;
  for (const b of s.beats) {
    if (b.hold == null) b.hold = 0.9;
    b._u = units(b);
    const need = 0.3 + b._u[b._u.length - 1] / RATE + b.hold + 0.9;
    b.dur = Math.max(b.dur, +need.toFixed(2));
    b._start = at; at += b.dur;
  }

}

// The voice is the clock: each word of `say` has a time, and things appear when their words are spoken.
const words = (b) => (b.say || "").split(/\s+/).filter(Boolean);
const span = (b) => Math.max(0.1, b.dur - 0.9 - (b.hold || 0));
const wordTime = (b, i) => { const u = b._u || units(b); return 0.3 + (u[Math.min(i, u.length - 1)] / u[u.length - 1]) * span(b); };
function findWord(b, text, from = 0) {
  const ws = words(b).map((w) => w.toLowerCase().replace(/[^a-z']/g, ""));
  const key = text.toLowerCase().split(/\s+/)[0].replace(/[^a-z']/g, "");
  for (let i = from; i < ws.length; i++) if (ws[i].startsWith(key)) return i;

}
function caption(b, t) {

  const sents = []; let cur = [];
  ws.forEach((w, i) => { cur.push(i); if (/[.?!]$/.test(w)) { sents.push(cur); cur = []; } });
  if (cur.length) sents.push(cur);

  const sent = sents.find((g) => g.includes(now)) || sents[0];

// a spring that settles with a slight overshoot; and an ease that pulls back before it goes and overshoots on arrival
const spring = (s) => s <= 0 ? 0 : 1 - Math.exp(-8 * s) * Math.cos(12 * s);

let MC = null;
function textW(t, font) { if (!MC) MC = document.createElement("canvas").getContext("2d"); MC.font = font; return MC.measureText(t).width; }
// matching transform: words two labels share stay put; the rest give way
function morphText(a, b, k) {
  const wa = a.split(" "), wb = b.split(" "); let n = 0;
  while (n < wa.length && n < wb.length && wa[n].toLowerCase() === wb[n].toLowerCase()) n++;
  const keep = wb.slice(0, n).join(" "), ra = wa.slice(n).join(" "), rb = wb.slice(n).join(" ");
  return `${esc(keep)}${keep ? " " : ""}<span style="position:relative;display:inline-block"><span style="position:absolute;left:0;white-space:nowrap;opacity:${1 - k};transform:translateY(${-30 * k}px);filter:blur(${6 * k}px)">${esc(ra)}</span><span style="display:inline-block;opacity:${k};transform:translateY(${30 * (1 - k)}px);filter:blur(${6 * (1 - k)}px)">${esc(rb)}</span></span>`;

const fadeIn = (t) => ease(t / 0.35), fadeOut = (t, dur) => clamp((dur - t) / 0.3);

// When each named thing is said: the first content word of each key, found in
// order in the line spoken; a key not found gets a time between its neighbours.
const STOP = new Set(["a", "an", "the", "of", "to", "in", "on", "from", "and", "it", "is", "for", "with", "by"]);
function keyWord(s) { return (String(s).split(/\s+/).find((w) => !STOP.has(w.toLowerCase().replace(/[^a-z']/g, ""))) || s).toLowerCase().replace(/[^a-z']/g, ""); }
function timesFor(b, keys) {
  const ws = words(b).map((w) => w.toLowerCase().replace(/[^a-z']/g, ""));
  const idx = []; let from = 0;
  for (const k of keys) {
    const key = keyWord(k); let hit = -1;
    const match = (i) => key && !idx.includes(i) && (ws[i].startsWith(key) || (key.length > 4 && ws[i].startsWith(key.slice(0, key.length - 2))));
    for (let i = from; i < ws.length; i++) if (match(i)) { hit = i; break; }
    if (hit < 0) for (let i = 0; i < from; i++) if (match(i)) { hit = i; break; }

  }
  const last = Math.max(1, ws.length - 1);

const draw = {

      const q = spring(t - at[j]), y = y0 + gap * j, on = j === lit || all > 0;
      h += `<div style="position:absolute;left:120px;right:100px;top:${y + (1 - q) * 20}px;display:flex;gap:34px;align-items:baseline;opacity:${clamp(q * 1.4) * (on ? 1 : 0.5)}">
        <span style="font-size:52px;font-weight:600;color:${A.c};min-width:44px;text-shadow:${on ? `0 0 26px rgba(${A.rgb},.7)` : "none"}">${j + 1}</span>
        <span style="font-size:${on ? 60 : 56}px;font-weight:${on ? 600 : 500};line-height:1.1;letter-spacing:-.015em;color:${on ? "#f3f2ee" : "#c9c8c2"}">${esc(s)}</span></div>`;
    });
    return { html: h, light: [440, lit < 0 ? y0 : y0 + gap * lit], hits: at };
  },
  // the piece's cycle: steps around a ring, lit as they are said, closing back to the first
  loop(b, t) {
    const n = b.items.length, cx = 540, cy = 700, rx = 370, ry = 380;
    const pos = b.items.map((_, j) => { const ang = -Math.PI / 2 + (j / n) * Math.PI * 2; return [cx + rx * Math.cos(ang), cy + ry * Math.sin(ang)]; });
    const times = timesFor(b, b.items), end = b.dur - (b.hold || 0);
    const litIdx = times.reduce((acc, tm, j) => (t >= tm ? j : acc), -1);
    let s = `<svg width="1080" height="1250"><defs><marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#80848d"/></marker></defs>`;
    for (let j = 0; j < n; j++) {
      const [x1, y1] = pos[j], [x2, y2] = pos[(j + 1) % n];
      const a = j < n - 1 ? ease((t - times[j + 1] + 0.35) / 0.35) : ease((t - end + 0.2) / 0.5);
      const k1 = 0.3, k2 = 0.7;
      s += `<line x1="${x1 + (x2 - x1) * k1}" y1="${y1 + (y2 - y1) * k1}" x2="${x1 + (x2 - x1) * (k1 + (k2 - k1) * a)}" y2="${y1 + (y2 - y1) * (k1 + (k2 - k1) * a)}" stroke="#80848d" stroke-width="4" marker-end="${a > 0.95 ? "url(#h)" : ""}" opacity="${a}"/>`;
    }
    b.items.forEach((st, j) => {
      const [x, y] = pos[j], a = ease((t - times[j]) / 0.4), on = j === litIdx && t < end;
      const d = (j < n - 1 ? ease((t - times[j + 1]) / 0.6) : 0) * (1 - ease((t - end) / 0.8));
      const w = Math.max(240, textW(st, "600 38px Geist") + 70), h = 96;
      s += `<g opacity="${a * (1 - 0.4 * d)}" style="filter:blur(${1.8 * d}px)" transform="translate(${x} ${y}) scale(${0.85 + 0.15 * spring(t - times[j])}) translate(${-x} ${-y})"><rect x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="28" style="${on ? `filter:drop-shadow(0 0 22px ${A.c})` : ""}" fill="${on ? A.c : "#15171c"}" stroke="${on ? A.c : "#2d3036"}" stroke-width="3"/><text x="${x}" y="${y + 13}" text-anchor="middle" font-size="38" font-weight="600" fill="${on ? "#111214" : "#eeece6"}">${esc(st)}</text></g>`;
    });
    s += `</svg>`;
    let lp = pos[0];
    times.forEach((tm, j) => { if (j > 0) { const q = ease((t - tm) / 0.9); lp = [lerp(lp[0], pos[j][0], q), lerp(lp[1], pos[j][1], q)]; } });
    if (t > end) lp = [lerp(lp[0], cx, ease((t - end) / 1.2)), lerp(lp[1], cy, ease((t - end) / 1.2))];
    return { html: labelOf(b) + s, light: lp, hits: times };
  },
  // words from the piece, set large, arriving as they are said
  quote(b, t) {
    const ws = b.text.split(" ");
    const html = ws.map((w, j) => { const q = ease((t - wordTime(b, Math.round((j / ws.length) * (words(b).length - 1)))) / 0.4); return `<span style="display:inline-block;margin-right:.24em;opacity:${0.2 + 0.8 * q}">${esc(w)}</span>`; }).join("");
    return { html: labelOf(b) + `<div style="position:absolute;left:120px;right:110px;top:380px;font-size:76px;font-weight:500;line-height:1.18;letter-spacing:-.02em">“${html}”</div>`, light: [540, 560], hits: [0.3] };
  },
  // the short version: each line of the formula arrives in turn, arrows drawn
  close(b, t) {
    const L = b.lines, n = L.length, at = L.map((_, j) => wordTime(b, Math.round((j / n) * (words(b).length - 1)))), gap = 250, y0 = 620 - (gap * (n - 1)) / 2 - 60;
    let h = `<div class="label" style="opacity:${ease(t / 0.5)}">THE WHOLE IDEA</div>`;
    L.forEach((line, j) => {
      const q = spring(t - at[j]), c = pal(["gist", "cue", "rebuild"][j % 3]);
      const parts = line.split("→").map((p) => p.trim());
      const inner = parts.map((p, k) => `${k ? `<span style="color:#7d818b;margin:0 .3em">→</span>` : ""}<span style="color:${k === parts.length - 1 ? c.c : "#eeece6"};${k === parts.length - 1 ? `text-shadow:0 0 30px rgba(${c.rgb},.55)` : ""}">${esc(p)}</span>`).join("");
      h += `<div style="position:absolute;left:100px;right:90px;top:${y0 + gap * j + (1 - q) * 24}px;font-size:56px;font-weight:600;line-height:1.16;letter-spacing:-.02em;opacity:${clamp(q * 1.4)}">${inner}</div>`;
    });
    let lit = 0; at.forEach((a, j) => { if (t >= a) lit = j; });
    return { html: h, light: [540, y0 + gap * lit + 40], hits: at };
  },
};

// Draw one shot at its own time, into its own layer, in its own colour.
function shot(i, t) {
  const b = SPEC.beats[i];
  A = pal(b.color);
  const out = draw[b.type](b, t, i);
  const k = inout(t / b.dur);
  const rack = b.carry ? 1 : inout((t - 0.1) / 1.4);
  const dq = out.dolly != null ? inout((t - out.dolly) / 2.0) : 0;
  const tilt = b.carry ? 0 : 7 * (1 - inout(t / 2.4));
  const vars = `--acc:${A.c};--accrgb:${A.rgb};--accd:${A.d};`;
  const aIn = i === 0 ? fadeIn(t) : 1;
  return {
    b, out, A: { ...A },
    stage: `<div style="position:absolute;inset:0;${vars}transform:perspective(1800px) rotateX(${tilt}deg) rotateY(${0.6 * Math.sin(t * 0.35)}deg) scale(${1 + 0.03 * k + 0.08 * dq}) translateY(${-10 * k}px);transform-origin:50% 42%"><div class="layer" style="opacity:${aIn};filter:blur(${(1 - rack) * 9}px)">${out.html}</div>${out.keep || ""}</div>`,
    bg: `<div style="position:absolute;inset:0;transform:scale(${1 + 0.012 * k - 0.16 * dq}) translateY(${-6 * k}px)">${background(i, t, b, out.light || [540, 600], rack)}</div>`,
    fx: lens(i, t, out.light || [540, 600], pulseOf(t, out.hits)),
    cap: caption(b, t), capA: Math.min(fadeIn(t), 1),
  };
}
function render(T) {
  const B = SPEC.beats, n = B.length;
  let i = 0; while (i < n - 1 && T >= B[i + 1]._start) i++;
  const t = T - B[i]._start;
  // inside the overlap around a cut, both shots are drawn: the old one pushes on and softens, the new one comes into focus
  let prevI = null, nextI = null, x = 1;
  if (i > 0 && t < OVERLAP / 2) { prevI = i - 1; x = inout((t + OVERLAP / 2) / OVERLAP); }
  else if (i < n - 1 && t > B[i].dur - OVERLAP / 2) { nextI = i + 1; x = 1 - inout((t - (B[i].dur - OVERLAP / 2)) / OVERLAP); }
  const cur = shot(i, t);
  const other = prevI != null ? shot(prevI, T - B[prevI]._start) : nextI != null ? shot(nextI, Math.max(0, T - B[nextI]._start)) : null;
  const otherIsNext = nextI != null;
  // x is how much the current shot owns the frame
  const layer = (sh, a, outgoing) => {
    const blur = (1 - a) * 14, sc = outgoing ? 1 + 0.05 * (1 - a) : 0.97 + 0.03 * a;
    return `<div style="position:absolute;inset:0;opacity:${a};filter:blur(${blur.toFixed(2)}px);transform:scale(${sc});transform-origin:50% 45%">${sh.stage}</div>`;
  };
  // the very end: rack off the last shot and arrive at the first frame, so the video loops
  const last = i === n - 1, q = last ? inout((t - (B[i].dur - 3.0)) / 2.6) : 0;
  let st = "", bg = "", fx = "";
  if (other) {
    const curOut = otherIsNext;            // the current shot is leaving if the other is the next one
    st = layer(other, 1 - x, !curOut) + layer(cur, x, curOut);
    bg = `<div style="position:absolute;inset:0;opacity:${1 - x}">${other.bg}</div><div style="position:absolute;inset:0;opacity:${x}">${cur.bg}</div>`;
    fx = `<div style="position:absolute;inset:0;opacity:${1 - x}">${other.fx}</div><div style="position:absolute;inset:0;opacity:${x}">${cur.fx}</div>`;
  } else {
    st = `<div style="position:absolute;inset:0;opacity:${1 - q};filter:blur(${9 * q}px)">${cur.stage}</div>`;
    bg = `<div style="position:absolute;inset:0;opacity:${1 - q}">${cur.bg}</div>`;
    fx = `<div style="position:absolute;inset:0;opacity:${1 - q}">${cur.fx}</div>`;
  }
  let ringHtml = `<div style="position:absolute;inset:0;opacity:${1 - q}">${ring(i, t)}</div>`;
  if (q > 0) {
    const f = shot(0, 0);
    A = pal(B[0].color);
    bg += `<div style="position:absolute;inset:0;opacity:${q}">${f.bg}</div>`;
    fx += `<div style="position:absolute;inset:0;opacity:${q}">${f.fx}</div>`;
    ringHtml += `<div style="position:absolute;inset:0;opacity:${q}">${ring(0, 0)}</div>`;
  }
  document.getElementById("bg").innerHTML = bg;
  document.getElementById("fx").innerHTML = fx;
  document.getElementById("stage").innerHTML = st;
  document.getElementById("cam").style.transform = "none";
  document.getElementById("bg").style.transform = "none";
  // captions: the sentence being spoken; across a cut, one gives way to the other
  const capOf = (sh, a) => `<div style="position:absolute;left:0;right:0;top:0;opacity:${a}">${sh.cap}</div>`;
  const cap = document.getElementById("cap");
  cap.innerHTML = other ? capOf(other, (1 - x) * other.capA) + capOf(cur, x * cur.capA) : capOf(cur, cur.capA * (1 - q));
  cap.style.opacity = 1;
  document.getElementById("ring").innerHTML = ringHtml;
}
</script></body></html>
