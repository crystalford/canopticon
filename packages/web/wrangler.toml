name = "canopticon-web"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Public env vars are inlined at build time via NEXT_PUBLIC_*. Set
# these in the Cloudflare Pages dashboard under
# Settings → Environment variables → Production:
#
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   NEXT_PUBLIC_API_BASE_URL
#
# (No runtime secrets needed — auth is cookie-based via Supabase SSR
# and all privileged operations live behind the Workers API.)
