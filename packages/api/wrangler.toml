name = "canopticon-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Custom domains for canopticon.com / www.canopticon.com are configured
# via the Cloudflare dashboard (Workers & Pages → canopticon-api →
# Settings → Domains & Routes). Those persist across deploys and don't
# need a `routes` block here — adding one would require Workers Routes
# Edit on the zone, which the deploy token doesn't have.

# D1 database — created via the deploy workflow with
# `wrangler d1 create canopticon` then the database_id is written here.
# Migrations live under supabase/migrations/ (kept that path for git history).
[[d1_databases]]
binding = "DB"
database_name = "canopticon"
database_id = "PLACEHOLDER_FILLED_BY_DEPLOY_WORKFLOW"
migrations_dir = "../../supabase/migrations"

# R2 buckets — created via deploy workflow with
# `wrangler r2 bucket create canopticon-files`.
[[r2_buckets]]
binding = "FILES"
bucket_name = "canopticon-files"

# Vectorize index for entity-resolution and claim-dedup embeddings.
# Created via `wrangler vectorize create canopticon-embeddings --dimensions=1024 --metric=cosine`.
[[vectorize]]
binding = "EMBEDDINGS"
index_name = "canopticon-embeddings"

# Workers AI — free-tier inference for Llama 4 Scout, Llama 3.3 70B,
# QwQ-32B reasoning, and bge-large-en-v1.5 embeddings.
[ai]
binding = "AI"

# Cron Triggers — DISABLED 2026-09-13 at the operator's explicit request:
# this product is not being actively used right now (attention has moved
# to v2, built elsewhere), so there is no live on-demand traffic for the
# `scheduled()` handler in src/index.ts to be a safety net for either.
# Fully off, not just slowed.
#
# A prior pass on this same PR (#163) tried a */30 reduced cadence instead
# of full removal, because the default branch of scheduled() is also the
# only dispatcher for digest_jobs rows that on-demand actions enqueue
# without running inline — video import (graph/lib/video-intake.ts),
# record expansion (graph/lib/record-builder.ts), bulk ZIP extraction past
# the first 3 jobs (operator/routes.ts), and on-demand research's pass 2
# (graph/lib/deep-research.ts's advanceResearchRun). That distinction
# stops mattering when nothing is enqueuing those jobs in the first place:
# the operator confirmed the site is effectively idle, so there's nothing
# for the dispatcher to be a safety net for right now. If that changes —
# the Worker comes back into active use before this line does — re-enable
# with a cadence (not a full uncomment of */2) so a stray queued job from
# that renewed use doesn't wait forever; see the git history on this file
# for the */30 version and its reasoning.
#
# Re-enable by uncommenting the two lines below. Everything else about
# the Worker (the public site, the operator console, on-demand actions)
# is untouched — this only stops the background sweep.
# [triggers]
# crons = ["*/2 * * * *", "0 12 * * 1"]

[vars]
LOG_LEVEL = "info"
OPERATOR_EMAIL = ""
# Set on the operator session cookie so it crosses canopticon.com →
# video.canopticon.com (the daily video Worker shares SESSION_SECRET and
# reads the same cookie). Leave empty for local dev.
SESSION_COOKIE_DOMAIN = ".canopticon.com"
# The video Worker's URL — where "Produce video essay" (on a signed File)
# POSTs a reading's content, and where the public /videos section reads
# the published-segments list from. Pair with the VIDEO_INTERNAL_TOKEN
# Worker secret (same value as the video Worker's own
# VIDEO_INTERNAL_TOKEN — set via the VIDEO_INTERNAL_TOKEN GitHub Actions
# repo secret, pushed to both Workers by their deploy workflows). Leave
# empty to keep the produce action inert and /videos showing an honest
# empty state.
VIDEO_BASE = "https://video.canopticon.com"
# Cloudflare Browser Rendering — optional. Set this to your account id to
# enable web_search / web_fetch_rendered chat tools. Pair with the
# CLOUDFLARE_API_TOKEN Worker secret (`wrangler secret put CLOUDFLARE_API_TOKEN`)
# scoped with the 'Browser Rendering Edit' permission. ~$0.005 per page.
# Leave empty to keep web research limited to Wikipedia (free).
CLOUDFLARE_ACCOUNT_ID = ""
# Toggles the Graph compartment. "true" enables substrate tools in chat
# (search_substrate, query_graph, create_source, etc.) and fires the
# auto-cascade on post publish. "false" hides graph tools entirely; CMS
# (chat -> draft -> publish -> /p/<slug>) keeps working with no graph
# dependency. Flip per environment to develop graph features without
# breaking the publication.
GRAPH_ENABLED = "true"
# Toggles the Studio compartment (audio production). "true" enables
# studio chat tools (propose_script_from_post, start_recording, etc.) and
# unlocks the six-tab Studio shell at /studio. "false" hides studio
# tools entirely; CMS and Graph work standalone. Flip per environment
# to develop studio features without breaking the publication.
STUDIO_ENABLED = "false"
# Toggle for the on-demand research writer (graph/lib/deep-research.ts).
# "workers_ai" (default, any value other than "anthropic" falls back to
# this too): gpt-oss-120b, free. "anthropic": Claude, real cost per call —
# and still inert even when set, until a cost_whitelists row exists for
# operation_type 'anthropic.research_writer' (the cost gate denies
# anything unwhitelisted by default; see cost/approve.ts). Meant to stay
# "workers_ai" until deliberately turned on.
RESEARCH_LLM_PROVIDER = "workers_ai"
# Claude through this Worker's AI binding — Cloudflare AI Gateway with
# Unified Billing (docs/the-record.md §3). Set AI_GATEWAY_ID to the name
# of a gateway (dashboard: AI → AI Gateway) that has Unified Billing turned
# on and credits loaded; the Worker then runs `anthropic/…` models through
# `env.AI.run(model, body, { gateway: { id } })`, billed to those credits,
# with no Anthropic key. Every judgement role in src/llm/router.ts prefers
# Claude when this is set. Leave empty and every role stays on Workers AI;
# the library header says "gateway not configured" rather than pretending.
AI_GATEWAY_ID = ""
# The exact model name the gateway lists. Empty means the default in
# src/env.ts (DEFAULT_CLAUDE_MODEL, "anthropic/claude-opus-4.1"); the
# dashboard's list is the authority — e.g. "anthropic/claude-sonnet-4.5".
CLAUDE_MODEL = ""
