name: Set/rotate SESSION_SECRET

# On-demand utility: generates a fresh random value entirely inside the
# runner and pipes it straight into `wrangler secret put`, so the value is
# never logged, echoed, or seen outside this job. Fixes the specific gap in
# CLAUDE.md's "Operator setup post-merge" checklist step 1 — without this
# secret, /auth/login 503s before it even looks at the Cloudflare Access
# JWT, so the operator's browser session can never be minted and every
# operator-only affordance (the Library upload form, signed-draft review,
# etc.) stays invisible on the live site regardless of any UI work.
#
# Running this invalidates every existing operator session cookie (they're
# signed with the old secret) — expected the first time this runs. Re-run
# later only if you deliberately want to force every session to re-login.

on:
  workflow_dispatch:

jobs:
  set-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate + push SESSION_SECRET
        working-directory: packages/api
        run: openssl rand -hex 32 | pnpm exec wrangler secret put SESSION_SECRET
