name: Smoke test (verify Supabase setup)

# Verifies your live Supabase project is healthy without spending
# Anthropic credits. Runs after you've completed initial setup to
# confirm everything's wired up.
#
# How to run: GitHub → Actions tab → "Smoke test (verify Supabase
# setup)" in the left sidebar → "Run workflow" button.
#
# Required GitHub secrets:
#   SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm smoke
