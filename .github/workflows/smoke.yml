name: Smoke test (verify deployment)

# Verifies the deployed Worker is healthy. Runs after initial setup or
# after each push to confirm everything's wired up.
#
# How to run: GitHub → Actions tab → "Smoke test (verify deployment)"
# in the left sidebar → "Run workflow" button.
#
# Required GitHub secrets:
#   API_BASE_URL   — your deployed Worker URL, e.g. https://api.canopticon.com

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke test
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: pnpm smoke
