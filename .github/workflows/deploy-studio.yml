name: Deploy Studio

# CANOPTICON STUDIO — the deterministic editorial compiler.
#
# Deploys independently of the Record (canopticon-api). Its own D1, its own
# R2, its own migration numbering. Nothing here touches the publication.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

on:
  push:
    branches: [main, master]
    paths:
      - "packages/studio/**"
      - "supabase/migrations-studio/**"
      - ".github/workflows/deploy-studio.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- D1 --------------------------------------------------------
      - name: Ensure D1 database
        working-directory: packages/studio
        run: |
          set +e
          output=$(pnpm exec wrangler d1 create canopticon-studio 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ] && ! echo "$output" | grep -qiE "already exists|already created|duplicate"; then
            exit $code
          fi
          set -e

      - name: Resolve D1 database_id and patch wrangler.toml
        working-directory: packages/studio
        run: |
          DB_ID=$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name=="canopticon-studio") | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Failed to resolve D1 database_id"; exit 1
          fi
          echo "Using D1 database_id=$DB_ID"
          sed -i "s/PLACEHOLDER_FILLED_BY_DEPLOY_WORKFLOW/$DB_ID/" wrangler.toml

      - name: Run D1 migrations
        working-directory: packages/studio
        run: pnpm exec wrangler d1 migrations apply canopticon-studio --remote

      # --- R2 --------------------------------------------------------
      - name: Ensure R2 bucket
        working-directory: packages/studio
        run: |
          set +e
          output=$(pnpm exec wrangler r2 bucket create canopticon-studio-assets 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ] && ! echo "$output" | grep -qiE "already exists|already own it"; then
            exit $code
          fi
          set -e

      # --- Deploy ----------------------------------------------------
      - name: Deploy Worker
        working-directory: packages/studio
        run: pnpm exec wrangler deploy
