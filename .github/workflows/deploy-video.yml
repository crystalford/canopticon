name: Deploy Video Engine to Cloudflare

# Deploys the daily forensic video engine (packages/video) and its
# Container renderer (packages/video-renderer) to Cloudflare. Mirrors
# deploy-api.yml shape: idempotent D1 + R2 creation, migration apply,
# container push, worker deploy.
#
# Required GitHub secrets (additional to those used by deploy-api.yml):
#   SESSION_SECRET          (same value as the api Worker — one operator
#                            session across both subdomains)
#   ELEVENLABS_API_KEY      (Phase 1 onward; can be a placeholder for
#                            Phase 0)
#   MINIMAX_API_KEY         (Phase 1; placeholder OK for Phase 0)
#   GDELT_API_KEY           (Phase 1; placeholder OK for Phase 0)
#
# Triggered only when video-engine paths change so the publication
# deploy (deploy-api.yml) isn't blocked on Container build time.

on:
  push:
    branches: [main, master]
    paths:
      - "packages/video/**"
      - "packages/video-renderer/**"
      - "packages/shared/**"
      - "supabase/migrations-video/**"
      - "Dockerfile.video-renderer"
      - ".github/workflows/deploy-video.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- D1 database (canopticon-video) -----------------------------
      - name: Ensure D1 database
        working-directory: packages/video
        run: |
          set +e
          output=$(pnpm exec wrangler d1 create canopticon-video 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ] && ! echo "$output" | grep -qiE "already exists|already created|duplicate"; then
            exit $code
          fi
          set -e

      - name: Resolve D1 database_id and patch wrangler.toml
        working-directory: packages/video
        run: |
          DB_ID=$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name=="canopticon-video") | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Failed to resolve D1 database_id for canopticon-video"; exit 1
          fi
          echo "Using D1 database_id=$DB_ID"
          sed -i "s/PLACEHOLDER_FILLED_BY_DEPLOY_WORKFLOW/$DB_ID/" wrangler.toml

      - name: Run D1 migrations
        working-directory: packages/video
        run: pnpm exec wrangler d1 migrations apply canopticon-video --remote

      # --- R2 bucket (canopticon-video-assets) ------------------------
      - name: Ensure R2 bucket
        working-directory: packages/video
        run: |
          set +e
          output=$(pnpm exec wrangler r2 bucket create canopticon-video-assets 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ] && ! echo "$output" | grep -qiE "already exists|already own it"; then
            exit $code
          fi
          set -e

      # NOTE: there is no separate "build & push container image" step.
      # `wrangler containers push` doesn't exist in Wrangler 3.x (this
      # workflow's first version pinned ^3.86.0, before Cloudflare
      # Containers shipped in the CLI) and in 4.x it expects the TAG of
      # an already-built local image, not an app name — it's for pushing
      # a raw image directly, not for building from a Worker's
      # [[containers]] config. The correct, modern path (Wrangler 4.x)
      # is `wrangler deploy` on the Worker itself: it builds the image
      # from the Dockerfile the [[containers]] block points at
      # (packages/video-renderer) and pushes it as part of deploying,
      # gated by --containers-rollout below.

      # --- Worker secrets ---------------------------------------------
      - name: Push Worker secrets
        working-directory: packages/video
        run: |
          echo "${{ secrets.SESSION_SECRET }}" | pnpm exec wrangler secret put SESSION_SECRET
          # Phase 1 secrets — push as placeholders if unset so the
          # binding interface stays consistent. Wrangler treats empty
          # strings as valid secret values; the Worker reads them as
          # truthy-but-empty and falls back to internal defaults.
          if [ -n "${{ secrets.ELEVENLABS_API_KEY }}" ]; then
            echo "${{ secrets.ELEVENLABS_API_KEY }}" | pnpm exec wrangler secret put ELEVENLABS_API_KEY
          fi
          if [ -n "${{ secrets.MINIMAX_API_KEY }}" ]; then
            echo "${{ secrets.MINIMAX_API_KEY }}" | pnpm exec wrangler secret put MINIMAX_API_KEY
          fi
          if [ -n "${{ secrets.GDELT_API_KEY }}" ]; then
            echo "${{ secrets.GDELT_API_KEY }}" | pnpm exec wrangler secret put GDELT_API_KEY
          fi

      # --- Set OPERATOR_EMAIL var -------------------------------------
      - name: Patch OPERATOR_EMAIL into wrangler.toml
        working-directory: packages/video
        run: |
          sed -i "s|OPERATOR_EMAIL = \"\"|OPERATOR_EMAIL = \"${{ secrets.OPERATOR_EMAIL }}\"|" wrangler.toml

      # --- Deploy Worker ------------------------------------------------
      # Builds + pushes the container image (from the [[containers]]
      # block's `image = "../video-renderer"`) as part of this deploy.
      # --containers-rollout immediate rolls the container out to 100%
      # in one step rather than gradual percentage steps — correct for
      # a first deploy / CI, where there's no existing traffic to ease
      # into.
      - name: Deploy Worker
        working-directory: packages/video
        run: pnpm exec wrangler deploy --containers-rollout immediate

      # NOTE: video.canopticon.com custom domain is configured in the
      # Cloudflare dashboard one-time after the first deploy. The
      # deploy token doesn't have Workers Routes Edit on the zone, so
      # the [routes] block in wrangler.toml is intentionally absent.
