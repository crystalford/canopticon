name: Deploy to Cloudflare

# One-button deploy. Creates (or reuses) the D1 database, R2 bucket,
# and Vectorize index; runs migrations; pushes secrets; deploys the
# Worker (canopticon-api) which now hosts the API, the public site, and the operator console.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   ANTHROPIC_API_KEY
#   OPERATOR_EMAIL          (the email Cloudflare Access will gate to)
#
# Optional GitHub secrets (pushed to the Worker when present; features
# stay visible-but-inert without them):
#   AI_GATEWAY_ID + CF_AIG_TOKEN (the workspace's Claude through Cloudflare's
#                           AI Gateway with Unified Billing — no Anthropic key)
#   BRAVE_SEARCH_API_KEY    (record-building on click — "Expand this file")
#   BRAVE_ANSWERS_API_KEY   (operator-only research triage preview)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- D1 database -----------------------------------------------
      # Try to create; if it already exists, the API returns an error
      # that we recognize and continue.
      - name: Ensure D1 database
        working-directory: packages/api
        run: |
          set +e
          output=$(pnpm exec wrangler d1 create canopticon 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ] && ! echo "$output" | grep -qiE "already exists|already created|duplicate"; then
            exit $code
          fi
          set -e

      - name: Resolve D1 database_id and patch wrangler.toml
        working-directory: packages/api
        run: |
          DB_ID=$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name=="canopticon") | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Failed to resolve D1 database_id"; exit 1
          fi
          echo "Using D1 database_id=$DB_ID"
          sed -i "s/PLACEHOLDER_FILLED_BY_DEPLOY_WORKFLOW/$DB_ID/" wrangler.toml

      - name: Run D1 migrations
        working-directory: packages/api
        run: pnpm exec wrangler d1 migrations apply canopticon --remote

      # --- R2 bucket -------------------------------------------------
      - name: Ensure R2 bucket
        working-directory: packages/api
        run: |
          set +e
          output=$(pnpm exec wrangler r2 bucket create canopticon-files 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ] && ! echo "$output" | grep -qiE "already exists|already own it"; then
            exit $code
          fi
          set -e

      # --- Vectorize index -------------------------------------------
      - name: Ensure Vectorize index
        working-directory: packages/api
        run: |
          set +e
          output=$(pnpm exec wrangler vectorize create canopticon-embeddings --dimensions=1024 --metric=cosine 2>&1)
          code=$?
          echo "$output"
          if [ $code -ne 0 ] && ! echo "$output" | grep -qiE "already exists|duplicate_name"; then
            exit $code
          fi
          set -e

      # --- Worker secrets --------------------------------------------
      - name: Push Worker secrets
        working-directory: packages/api
        run: |
          echo "${{ secrets.ANTHROPIC_API_KEY }}" | pnpm exec wrangler secret put ANTHROPIC_API_KEY
          if [ -n "${{ secrets.BRAVE_SEARCH_API_KEY }}" ]; then
            echo "${{ secrets.BRAVE_SEARCH_API_KEY }}" | pnpm exec wrangler secret put BRAVE_SEARCH_API_KEY
          fi
          if [ -n "${{ secrets.BRAVE_ANSWERS_API_KEY }}" ]; then
            echo "${{ secrets.BRAVE_ANSWERS_API_KEY }}" | pnpm exec wrangler secret put BRAVE_ANSWERS_API_KEY
          fi
          if [ -n "${{ secrets.VIDEO_INTERNAL_TOKEN }}" ]; then
            echo "${{ secrets.VIDEO_INTERNAL_TOKEN }}" | pnpm exec wrangler secret put VIDEO_INTERNAL_TOKEN
          fi
          # The workspace's route to Claude through Cloudflare's AI Gateway
          # (Unified Billing): the gateway's authentication token.
          if [ -n "${{ secrets.CF_AIG_TOKEN }}" ]; then
            echo "${{ secrets.CF_AIG_TOKEN }}" | pnpm exec wrangler secret put CF_AIG_TOKEN
          fi

      # --- Set AI_GATEWAY_ID var, when the secret is set -----------------
      # The name of the AI Gateway (Unified Billing) the workspace calls
      # Claude through. Left empty in wrangler.toml when the secret is not set.
      - name: Patch AI_GATEWAY_ID into wrangler.toml
        working-directory: packages/api
        env:
          AI_GATEWAY_ID: ${{ secrets.AI_GATEWAY_ID }}
        run: |
          if [ -n "$AI_GATEWAY_ID" ]; then
            sed -i "s|^AI_GATEWAY_ID = \"\"|AI_GATEWAY_ID = \"${AI_GATEWAY_ID}\"|" wrangler.toml
          fi

      # --- Set OPERATOR_EMAIL var ------------------------------------
      - name: Patch OPERATOR_EMAIL into wrangler.toml
        working-directory: packages/api
        run: |
          sed -i "s|OPERATOR_EMAIL = \"\"|OPERATOR_EMAIL = \"${{ secrets.OPERATOR_EMAIL }}\"|" wrangler.toml

      # --- Set CLOUDFLARE_ACCOUNT_ID var ------------------------------
      # Reuses the SAME account id already authenticating this deploy
      # (the env var above) — never a value the operator has to paste
      # anywhere. Without this, record-builder.ts's Browser Rendering
      # fetch-fallback (bot-blocked/JS-rendered pages) silently no-ops
      # forever, since it checks env.CLOUDFLARE_ACCOUNT_ID at runtime.
      - name: Patch CLOUDFLARE_ACCOUNT_ID into wrangler.toml
        working-directory: packages/api
        run: |
          sed -i "s|CLOUDFLARE_ACCOUNT_ID = \"\"|CLOUDFLARE_ACCOUNT_ID = \"${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\"|" wrangler.toml

      # --- Deploy Worker ---------------------------------------------
      - name: Deploy Worker
        working-directory: packages/api
        run: pnpm exec wrangler deploy

      # Pages deploy removed in the PROBE pivot — the Worker serves
      # canopticon.com (public HTML at /*, operator HTML at /op/*, API
      # at /v1/*) directly. The canopticon-web Pages project still
      # exists in Cloudflare but receives no new deploys.
