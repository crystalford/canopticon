name: Deploy to Cloudflare

# One-button deploy. Creates (or reuses) the D1 database, R2 bucket,
# and Vectorize index; runs migrations; pushes secrets; deploys the
# Worker and Pages project; syncs the 18 skill prompts.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID
#   ANTHROPIC_API_KEY
#   OPERATOR_EMAIL          (the email Cloudflare Access will gate to)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- D1 database -----------------------------------------------
      - name: Create D1 database (idempotent)
        working-directory: packages/api
        run: |
          if pnpm exec wrangler d1 list --json | jq -e '.[] | select(.name=="canopticon")' >/dev/null; then
            echo "D1 database 'canopticon' already exists"
          else
            pnpm exec wrangler d1 create canopticon
          fi

      - name: Resolve D1 database_id and patch wrangler.toml
        working-directory: packages/api
        run: |
          DB_ID=$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name=="canopticon") | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Failed to resolve D1 database_id"; exit 1
          fi
          echo "Using D1 database_id=$DB_ID"
          sed -i "s/PLACEHOLDER_FILLED_BY_DEPLOY_WORKFLOW/$DB_ID/" wrangler.toml

      - name: Run D1 migrations
        working-directory: packages/api
        run: pnpm exec wrangler d1 migrations apply canopticon --remote

      # --- R2 bucket -------------------------------------------------
      - name: Create R2 bucket (idempotent)
        working-directory: packages/api
        run: |
          if pnpm exec wrangler r2 bucket list --json | jq -e '.[] | select(.name=="canopticon-files")' >/dev/null; then
            echo "R2 bucket 'canopticon-files' already exists"
          else
            pnpm exec wrangler r2 bucket create canopticon-files
          fi

      # --- Vectorize index -------------------------------------------
      - name: Create Vectorize index (idempotent)
        working-directory: packages/api
        run: |
          if pnpm exec wrangler vectorize list --json 2>/dev/null | jq -e '.[] | select(.name=="canopticon-embeddings")' >/dev/null; then
            echo "Vectorize index 'canopticon-embeddings' already exists"
          else
            pnpm exec wrangler vectorize create canopticon-embeddings --dimensions=1024 --metric=cosine
          fi

      # --- Worker secrets --------------------------------------------
      - name: Push Worker secrets
        working-directory: packages/api
        run: |
          echo "${{ secrets.ANTHROPIC_API_KEY }}" | pnpm exec wrangler secret put ANTHROPIC_API_KEY

      # --- Set OPERATOR_EMAIL var ------------------------------------
      - name: Patch OPERATOR_EMAIL into wrangler.toml
        working-directory: packages/api
        run: |
          sed -i "s|OPERATOR_EMAIL = \"\"|OPERATOR_EMAIL = \"${{ secrets.OPERATOR_EMAIL }}\"|" wrangler.toml

      # --- Deploy Worker ---------------------------------------------
      - name: Deploy Worker
        working-directory: packages/api
        run: pnpm exec wrangler deploy

      # --- Sync skill prompts ----------------------------------------
      # Skipped on first deploy (no users row yet); operator runs the
      # sync-skills workflow manually after first sign-in.

      # --- Build and deploy Pages ------------------------------------
      - name: Create Pages project (idempotent)
        working-directory: packages/web
        run: |
          if pnpm exec wrangler pages project list --json 2>/dev/null | jq -e '.[] | select(.name=="canopticon-web")' >/dev/null; then
            echo "Pages project 'canopticon-web' already exists"
          else
            pnpm exec wrangler pages project create canopticon-web --production-branch=main
          fi

      - name: Build web for Cloudflare Pages
        working-directory: packages/web
        env:
          # Build-time URL — overridden at runtime by the Pages env var
          # NEXT_PUBLIC_API_BASE_URL once you wire api.canopticon.com.
          # If you have NOT wired the custom domain yet, set this env var
          # manually in the Pages dashboard (Settings → Environment
          # variables) to your worker subdomain and redeploy.
          NEXT_PUBLIC_API_BASE_URL: https://api.canopticon.com
        run: pnpm pages:build

      - name: Deploy web to Pages
        working-directory: packages/web
        run: pnpm exec wrangler pages deploy .vercel/output/static --project-name=canopticon-web --branch=main --commit-dirty=true
