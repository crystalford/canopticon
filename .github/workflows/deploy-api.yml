name: Deploy API to Cloudflare Workers

# Auto-deploys the Worker (packages/api) whenever main changes.
# Run manually via the "Run workflow" button if you need a re-deploy
# without a code change.
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN      — Cloudflare API token with Workers
#                                Scripts:Edit + Account:Read scopes
#   CLOUDFLARE_ACCOUNT_ID     — your Cloudflare account ID
#   SUPABASE_URL              — Worker secret
#   SUPABASE_ANON_KEY         — Worker secret
#   SUPABASE_SERVICE_ROLE_KEY — Worker secret
#   SUPABASE_JWT_SECRET       — Worker secret
#   ANTHROPIC_API_KEY         — Worker secret

on:
  push:
    branches: [main, master]
    paths:
      - "packages/api/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Worker secrets
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.SUPABASE_URL }}"              | pnpm exec wrangler secret put SUPABASE_URL
          echo "${{ secrets.SUPABASE_ANON_KEY }}"         | pnpm exec wrangler secret put SUPABASE_ANON_KEY
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          echo "${{ secrets.SUPABASE_JWT_SECRET }}"       | pnpm exec wrangler secret put SUPABASE_JWT_SECRET
          echo "${{ secrets.ANTHROPIC_API_KEY }}"         | pnpm exec wrangler secret put ANTHROPIC_API_KEY

      - name: Deploy Worker
        working-directory: packages/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
