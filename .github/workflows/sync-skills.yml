name: Sync skill prompts to D1

# Reads packages/shared/skills/<role>/SKILL.md and writes the prompt
# text into role_definitions.prompt_template in the D1 database.
#
# Trigger this:
#   - After your first sign-in (so role_definitions rows exist)
#   - Any time you edit a SKILL.md prompt
#
# Required GitHub secrets:
#   CLOUDFLARE_API_TOKEN
#   CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
    inputs:
      role:
        description: "Single role name to sync (leave blank for all)"
        required: false
        default: ""
      dry_run:
        description: "Dry run only — show what would change, don't write"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wrangler.toml ships with a placeholder database_id that the
      # deploy workflow patches at deploy time. This job needs the same
      # patch so wrangler d1 execute can resolve the real database.
      - name: Resolve D1 database_id and patch wrangler.toml
        working-directory: packages/api
        run: |
          DB_ID=$(pnpm exec wrangler d1 list --json | jq -r '.[] | select(.name=="canopticon") | .uuid')
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Failed to resolve D1 database_id — has the deploy workflow run yet?"; exit 1
          fi
          echo "Using D1 database_id=$DB_ID"
          sed -i "s/PLACEHOLDER_FILLED_BY_DEPLOY_WORKFLOW/$DB_ID/" wrangler.toml

      - name: Sync skills
        env:
          ROLE: ${{ inputs.role }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        run: pnpm sync-skills
