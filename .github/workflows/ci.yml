name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # GitHub deliberately does not fire workflow triggers for events created
  # with an app token, so a pull request opened by tooling gets no CI at
  # all — and "CI is green" then means "CI never ran", which is the more
  # dangerous of the two states because it looks identical on the branch.
  workflow_dispatch:

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      - name: API bundle (wrangler dry-run)
        working-directory: packages/api
        run: pnpm exec wrangler deploy --dry-run

      - name: Video Worker bundle (wrangler dry-run)
        working-directory: packages/video
        run: pnpm exec wrangler deploy --dry-run

      - name: Blindspot Worker bundle (wrangler dry-run)
        working-directory: packages/blindspot
        run: pnpm exec wrangler deploy --dry-run

      - name: Studio Worker bundle (wrangler dry-run)
        working-directory: packages/studio
        run: pnpm exec wrangler deploy --dry-run

