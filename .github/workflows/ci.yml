name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # GitHub deliberately does not fire workflow triggers for events created
  # with an app token, so a pull request opened by tooling gets no CI at
  # all — and "CI is green" then means "CI never ran", which is the more
  # dangerous of the two states because it looks identical on the branch.
  workflow_dispatch:

jobs:
  check:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # WHICH WORKERS ACTUALLY CHANGED. The dry-run bundle checks below exist
      # to catch a Worker that no longer builds — real protection for a
      # Worker whose files changed, and near-zero value for one that did not,
      # since nothing about it is different from the last time it passed.
      # This used to be the difference between a one-minute job and a
      # nine-minute one, because the video Worker's dry run built its Docker
      # image. It no longer does (see `--containers-rollout none` below), so
      # skipping is now a smaller win — worth keeping, since a dry run still
      # costs a wrangler startup and says nothing new about a Worker whose
      # files did not change.
      # Falls back to running everything when there is no base to diff
      # against (a fresh branch, a manual dispatch, an unresolvable SHA) —
      # skipping is an optimisation earned by evidence, never the default.
      - name: Determine changed Workers
        id: changed
        run: |
          set -euo pipefail
          BASE=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.base_ref }}" 2>/dev/null && BASE="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "${{ github.event.before }}" 2>/dev/null && BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ]; then
            echo "no base to diff against — treating every Worker as changed"
            for p in api video blindspot studio; do echo "$p=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi

          # TWO DOTS, NOT THREE. Caught live: `checkout@v4`'s shallow clone
          # plus a separate `--depth=1` fetch of the base leaves two
          # disconnected shallow histories with no common ancestor, so the
          # three-dot form's merge-base lookup fails outright — "fatal: no
          # merge base" on every single PR, the first time this ran. A plain
          # two-dot diff compares the two trees directly and needs no
          # ancestry between them, which is all this ever actually wanted:
          # "what files differ", not "what changed excluding the base's own
          # later commits". Guarded too — a diff failure fails open the same
          # way an unresolvable base does, not silently as "nothing changed".
          if ! CHANGED="$(git diff --name-only "$BASE" HEAD)"; then
            echo "diff against $BASE failed — treating every Worker as changed"
            for p in api video blindspot studio; do echo "$p=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          echo "changed files since $BASE:"
          echo "$CHANGED"
          # A change to shared workspace config can affect every Worker's
          # build, so it marks all of them changed rather than none.
          if echo "$CHANGED" | grep -qE '^(pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.base\.json|packages/shared/|\.github/workflows/ci\.yml)$'; then
            for p in api video blindspot studio; do echo "$p=true" >> "$GITHUB_OUTPUT"; done
            exit 0
          fi
          # The Record's migrations live in `supabase/migrations/`; every other
          # package has its own `-<pkg>` directory beside it. The optional
          # group this used to use, `supabase/migrations(-$p)?/`, matched the
          # BARE path for all four packages — so one API migration marked
          # video changed and ran the container build this step exists to
          # skip. Caught live on the first PR to add a file under
          # `supabase/migrations/`: it failed there on runner disk space, not
          # on anything in the diff.
          for p in api video blindspot studio; do
            if [ "$p" = "api" ]; then MIGRATIONS="supabase/migrations/"; else MIGRATIONS="supabase/migrations-$p/"; fi
            if echo "$CHANGED" | grep -qE "^(packages/$p/|$MIGRATIONS)"; then
              echo "$p=true" >> "$GITHUB_OUTPUT"
            else
              echo "$p=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: API bundle (wrangler dry-run)
        if: steps.changed.outputs.api == 'true'
        working-directory: packages/api
        run: pnpm exec wrangler deploy --dry-run

      # `--containers-rollout none` is what keeps this step honest about its
      # own job. The video Worker has a Container binding, so a plain dry run
      # BUILDS Dockerfile.video-renderer — six minutes, several GB, and once
      # a runner-disk failure that turned CI red on a PR touching none of it.
      # None of that tests what a bundle check is for, which is "does this
      # Worker still compile". Measured: 6min -> ~2s, and the Worker and all
      # its bindings are still validated.
      #
      # The Dockerfile is not left unchecked: deploy-video.yml is path-filtered
      # on it and builds the real image when it changes. Code is checked here,
      # the deployable is checked there.
      - name: Video Worker bundle (wrangler dry-run)
        if: steps.changed.outputs.video == 'true'
        working-directory: packages/video
        run: pnpm exec wrangler deploy --dry-run --containers-rollout none

      - name: Blindspot Worker bundle (wrangler dry-run)
        if: steps.changed.outputs.blindspot == 'true'
        working-directory: packages/blindspot
        run: pnpm exec wrangler deploy --dry-run

      - name: Studio Worker bundle (wrangler dry-run)
        if: steps.changed.outputs.studio == 'true'
        working-directory: packages/studio
        run: pnpm exec wrangler deploy --dry-run

