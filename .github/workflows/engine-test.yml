name: Engine test

# Which model runs the workspace, decided by one fixed test rather than by
# impression (packages/api/src/write/eval.ts holds the tasks and the bar).
# Every model named is given every task on the live site, in memory (nothing
# is saved to the record), each result is graded against the bar, and the
# report names the cheapest model that passes every task.
#
# Run by hand only (rule 4: nothing runs unattended). A full run of two
# models costs about $2–4 of Workers AI and takes up to ~30 minutes.
# Claude engines are billed to Anthropic and need include_claude.

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated engine ids"
        required: true
        default: "@cf/deepseek-ai/deepseek-v4.1-flash-1017,@cf/deepseek-ai/deepseek-v4-pro-0813"
        type: string
      tasks:
        description: "Comma-separated task numbers from eval.ts (0-3)"
        required: true
        default: "0,1,2,3"
        type: string
      parallel:
        description: "Runs at once (Workers AI limits requests per minute across the account; 2 is close to one person's use)"
        required: false
        default: "2"
        type: string
      include_claude:
        description: "Allow Claude engines (billed to Anthropic)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  # One job, every report in parallel inside it: GitHub bills each job's
  # minutes, and a job per task waiting ~20 minutes on the live report billed
  # the sum of every report (2026-11-12: the engine tests had used most of
  # the account's monthly Actions minutes). Now it bills the longest batch.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run every task on every model
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          MODELS: ${{ github.event.inputs.models }}
          TASKS: ${{ github.event.inputs.tasks }}
          # Workers AI limits requests per minute per model across the
          # account: three research-team runs at once spent 6-14 minutes
          # waiting on it. Two at a time is close to one person's use.
          PARALLEL: ${{ github.event.inputs.parallel || '2' }}
          CLAUDE: ${{ github.event.inputs.include_claude == 'true' && '&claude=1' || '' }}
        run: |
          set -uo pipefail
          mkdir -p results
          jq -rn --arg m "$MODELS" --arg t "$TASKS" '
            ($t | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))[] as $task
            | ($m | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))[] as $model
            | "\($model) \($task)"' > pairs.txt
          cat > one.sh <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          MODEL="$1"; TASK="$2"
          ENC="$(jq -rn --arg m "$MODEL" '$m|@uri')"
          URL="https://canopticon.com/v1/admin/engine-try?model=${ENC}&eval=${TASK}&steps=100&deadline=1500&follow=2&full=1${CLAUDE}"
          NAME="$(printf '%s-%s' "$MODEL" "$TASK" | tr -c 'a-zA-Z0-9-' '-')"
          curl -sS -m 1600 \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            "$URL" > "results/${NAME}.raw" || true
          if jq -e .grade "results/${NAME}.raw" > /dev/null 2>&1; then
            mv "results/${NAME}.raw" "results/${NAME}.json"
          else
            jq -n --arg m "$MODEL" --arg t "$TASK" --rawfile b "results/${NAME}.raw" \
              '{model:$m, eval:($t|tonumber), failed_to_run:true, body:($b|.[0:2000]), grade:{pass:false, misses:["did not run"]}}' > "results/${NAME}.json"
            rm -f "results/${NAME}.raw"
          fi
          echo "done: $MODEL task $TASK"
          SH
          chmod +x one.sh
          export CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET CLAUDE
          xargs -P "$PARALLEL" -L 1 ./one.sh < pairs.txt
      - name: Write the verdict
        run: |
          set -euo pipefail
          mkdir -p ops/eval
          STAMP="$(date -u +%Y-%m-%d-%H%M)"
          jq -s '.' results/*.json > "ops/eval/${STAMP}.json"
          {
            echo "# Engine test — ${STAMP} UTC"
            echo
            echo "Tasks and bar: packages/api/src/write/eval.ts. Cost is Workers AI (or Anthropic) as metered by the workspace."
            echo
            echo "| Model | Task | Pass | Words | Quotes (not found) | Pages | Figures not in pages | Reviewer flags (changed) | Cost | Minutes | Misses |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|"
            jq -r '.[] | "| \(.model|sub("@cf/";"")) | \(.eval) \(.label // "") | \(if .grade.pass then "✅" else "❌" end) | \(.report.words // 0) | \(.report.quotations // 0) (\(.report.not_found // [] | length)) | \(.pages_read // [] | length) | \(.report.figures_not_in_pages // [] | length) | \(.report.review // [] | length) (\(.report.review // [] | map(select(.changed)) | length)) | $\(.dollars // 0) | \(((.seconds // 0) / 60) | floor) | \(.grade.misses | join("; ")) |"' "ops/eval/${STAMP}.json"
            echo
            # How each report reads against respected research writing
            # (research.ts RUBRIC): advisory, not yet on the pass bar.
            echo "### How it reads"
            echo
            echo "| Model | Task | Sources | Words per source (≤250) | Top publisher | Sentence words (≈20) | Over 35 words | TL;DR words (≤150) | Said again | Uncited facts | First person | Still to fix |"
            echo "|---|---|---|---|---|---|---|---|---|---|---|---|"
            jq -r '.[] | select(.report.rubric) | "| \(.model|sub("@cf/";"")) | \(.eval) | \(.report.rubric.sources) | \(.report.rubric.wordsPerSource) | \(if .report.rubric.topPublisher then "\(.report.rubric.topPublisher.sources) of \(.report.rubric.sources)" else "—" end) | \(.report.rubric.meanSentenceWords) | \((.report.rubric.longSentenceShare * 100) | floor)% | \(.report.rubric.tldrWords) | \(.report.writing.repeatedFacts // [] | length) | \(.report.writing.uncitedFacts // [] | length) | \(.report.writing.voice // [] | length) | \(.report.polish // [] | length) |"' "ops/eval/${STAMP}.json"
            echo
            echo "### What the evidence carries"
            echo
            echo "| Model | Task | Figures not on the cited page | Certainty above its evidence | Key Findings on one publisher | Sources by kind |"
            echo "|---|---|---|---|---|---|"
            jq -r '.[] | select(.report.evidence) | "| \(.model|sub("@cf/";"")) | \(.eval) | \(.report.evidence.misplacedFigures | length) | \(.report.evidence.overcertain | length) | \(.report.evidence.onePublisherFindings | length) | \(.report.evidence.profile | to_entries | sort_by(-.value) | map("\(.value) \(.key)") | join(", ")) |"' "ops/eval/${STAMP}.json"
            echo
            echo "## Verdict"
            echo
            jq -r '
              group_by(.model)
              | map({model: .[0].model, pass: all(.grade.pass), dollars: (map(.dollars // 0) | add), n: length})
              | sort_by(.dollars)
              | (map(select(.pass)) | if length > 0 then "Cheapest model that passed every task: **\(.[0].model)** ($\(.[0].dollars * 100 | round / 100) for \(.[0].n) tasks)." else "No model passed every task." end),
                "",
                (.[] | "- \(.model): \(if .pass then "passed all" else "failed at least one" end), $\(.dollars * 100 | round / 100) total")
            ' "ops/eval/${STAMP}.json"
          } > "ops/eval/${STAMP}.md"
          cp "ops/eval/${STAMP}.md" ops/eval/latest.md
          cat ops/eval/latest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the report
        run: |
          set -euo pipefail
          git config user.name "canopticon-probe[bot]"
          git config user.email "probe@users.noreply.github.com"
          git add ops/eval
          git commit -m "engine test: report [skip ci]" || exit 0
          for i in 1 2 3 4 5 6; do
            if git push; then exit 0; fi
            sleep $((i * 3))
            git pull --rebase -X theirs
          done
          git push
